services:
  jelly-notify:
    image: ghcr.io/wagchi22/jelly-notify:latest
    container_name: jelly-notify
    init: true
    restart: unless-stopped
    entrypoint:
      - sh
      - -c
      - find /app/.wwebjs_auth -name 'Singleton*' -delete; exec docker-entrypoint.sh "$@"
      - --
    command: ["node", "src/index.js"]
    env_file:
      - .env
    environment:
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      PUPPETEER_NO_SANDBOX: "1"
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - jelly-notify:/app/.wwebjs_auth
      - jelly-notify:/app/.wwebjs_cache

volumes:
  jelly-notify:
    name: jelly-notify
    external: true